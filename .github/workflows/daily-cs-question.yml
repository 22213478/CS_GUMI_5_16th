name: 오늘의 CS 질문

on:
  schedule:
    # 정각의 GitHub Actions 예약 실행 혼잡을 피해 일~목 22:07 UTC = 다음 날 07:07 KST
    - cron: "7 22 * * 0-4"
  workflow_dispatch:
    inputs:
      study_date:
        description: "출제할 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-cs-question
  cancel-in-progress: false

jobs:
  create-question:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: CS 질문 Issue와 Discord 알림 생성
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STUDY_DATE: ${{ inputs.study_date }}
        run: node scripts/create-daily-cs-question.mjs
