name: PR 제목과 본문 자동 입력

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "answers/**/*.md"

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      # Fork의 코드를 checkout하거나 실행하지 않고 base 브랜치의 스크립트만 사용합니다.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: PR 제목과 제출 정보 입력
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-pr-metadata.mjs

